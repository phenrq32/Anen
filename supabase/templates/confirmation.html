<!doctype html>
<html lang="pt">
  <body style="margin:0;background:#090909;font-family:Inter,Arial,sans-serif;color:#ffffff">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:40px 16px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#141414;border:1px solid #2a2a2a;border-radius:16px;padding:32px">
            <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.02em">ANEN</td></tr>
            <tr><td style="padding-top:24px;font-size:18px;font-weight:700">Confirme o seu email · Confirme seu e-mail</td></tr>
            <tr><td style="padding-top:12px;font-size:15px;line-height:1.6;color:#a3a3a3">Para ativar a sua conta ANEN, confirme este endereço.</td></tr>
            <tr>
              <td style="padding-top:28px">
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/boas-vindas"
                   style="display:inline-block;background:#FF851B;color:#090909;font-weight:700;text-decoration:none;padding:12px 22px;border-radius:12px">Confirmar email</a>
              </td>
            </tr>
            <tr><td style="padding-top:28px;font-size:12px;line-height:1.6;color:#737373">Se não criou esta conta, ignore esta mensagem.</td></tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
